<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>AgentMom</title>
<link rel="icon" type="image/png" href="/ui/icon.png">

<link rel="stylesheet" href="/ui/layout.css">

<body>
<noscript><p class="am-empty">Bu uygulama çalışmak için JavaScript gerektirir.</p></noscript>

<p id="bootNote" class="am-empty">Arayüz yükleniyor. Bu yazı kalırsa betikler yüklenemedi: sayfayı yenileyin ya da sunucuyu yeniden başlatın.</p>

<main id="loginView" class="am-login" hidden>
  <section class="am-card" aria-labelledby="loginTitle">
    <h1 id="loginTitle" data-i18n="login.title"></h1>
    <p data-i18n="login.help"></p>
    <form id="loginForm" autocomplete="off">
      <label for="tokenInput" data-i18n="login.label"></label>
      <input id="tokenInput" type="password" autocomplete="off" spellcheck="false" required>
      <button id="loginSubmit" class="am-btn am-btn--primary" type="submit" data-i18n="login.submit"></button>
    </form>
    <p id="loginMsg" class="am-note" role="status"></p>
  </section>
</main>

<div id="app" class="am-app" data-drawer="" data-panel="closed" data-sidebar="open" data-panel-wide="0" hidden>
  <aside id="sidebar" class="am-sidebar" aria-label="Oturumlar">
    <div id="userMenuRoot"></div>
  </aside>

  <main id="main" class="am-main">
    <header id="topbar" class="am-topbar"></header>

    <div id="errorCard" class="am-card am-error" role="alert" hidden>
      <h2 id="errorTitle"></h2>
      <p id="errorMsg"></p>
      <button id="errorRetry" class="am-btn am-btn--primary" type="button" data-i18n="error.retry"></button>
    </div>

    <section id="chatView" class="am-chat" aria-label="Sohbet"></section>
    <section id="pageView" class="am-pageview" aria-label="Sayfa" hidden></section>
  </main>

  <aside id="panel" class="am-panel" aria-label="Genel bakış"></aside>

  <div id="scrim" class="am-scrim"></div>
</div>

<div id="overlayRoot" class="am-overlay-root"></div>

<script src="/ui/strings.js" defer></script>
