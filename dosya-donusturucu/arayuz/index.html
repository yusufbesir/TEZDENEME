<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dosya Dönüştürücü</title>
  <link rel="stylesheet" href="stil.css">
</head>
<body>
  <div class="kabuk">
    <aside class="yan" aria-label="Ana menü">
      <div class="marka">
        <svg class="marka-simge" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h11l-3-3M20 17H9l3 3M15 7l-1 0M4 7v0M20 17v0" /><path d="M7 12h10" /></svg>
        <div>
          <div class="marka-ad">Dosya Dönüştürücü</div>
          <div class="marka-alt">Her şey bilgisayarında</div>
        </div>
      </div>
      <nav class="menu" id="menu">
        <button class="menu-oge" data-kategori="donustur" data-sayfa="donustur" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><span>Dönüştür</span></button>
        <button class="menu-oge" data-kategori="pdf" data-sayfa="pdf" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M9.5 17v-4h1.3a1.2 1.2 0 0 1 0 2.4H9.5M14 17v-4M14 13h1.8M14 15h1.4"/></svg><span>PDF Araçları</span></button>
        <button class="menu-oge" data-kategori="arsiv" data-sayfa="arsiv" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/></svg><span>Arşiv</span></button>
      </nav>
      <nav class="menu menu-alt">
        <button class="menu-oge" data-sayfa="gecmis" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Geçmiş</span></button>
        <button class="menu-oge" data-sayfa="ayarlar" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span>Ayarlar</span></button>
        <button class="menu-oge" data-sayfa="hakkinda" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg><span>Hakkında ve Lisanslar</span></button>
      </nav>
    </aside>

    <div class="ana">
      <main class="sayfa" id="sayfa" tabindex="-1"></main>
      <section class="kuyruk" id="kuyruk" aria-label="Dönüştürme kuyruğu">
        <header class="kuyruk-baslik">
          <h2>Kuyruk <span class="sayac" id="kuyruk-sayac">0</span></h2>
          <div class="kuyruk-eylem">
            <button class="dugme ikincil kucuk" id="kuyruk-temizle" type="button">Bitenleri temizle</button>
            <button class="dugme tehlike kucuk" id="kuyruk-iptal" type="button">Tümünü iptal et</button>
          </div>
        </header>
        <ul class="kuyruk-liste" id="kuyruk-liste">
          <li class="bos" id="kuyruk-bos">Henüz bir iş yok. Dosya ekleyip &laquo;Dönüştür&raquo; düğmesine bas.</li>
        </ul>
      </section>
    </div>
  </div>
  <div class="bildirim-alani" id="bildirimler" role="status" aria-live="polite"></div>
  <script type="module" src="uygulama.js"></script>
</body>
</html>
